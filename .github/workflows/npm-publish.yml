name: Publish package to npm

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Publish if this version is not on npm yet
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          server_version="$(node -p "require('fs').readFileSync('src/index.ts','utf8').match(/new McpServer\\(\\{[^}]*version: \"([^\"]+)\"/s)?.[1] ?? ''")"
          if [[ "${server_version}" != "${version}" ]]; then
            echo "package.json version (${version}) does not match MCP server version (${server_version})." >&2
            exit 1
          fi
          if out="$(npm view "${name}@${version}" version 2>&1)"; then
            echo "${name}@${version} already published; skipping."
          elif grep -q E404 <<< "${out}"; then
            # A concurrent run may have published this version already; treat that as success.
            if ! npm publish --access public; then
              sleep 15
              npm view "${name}@${version}" version || exit 1
              echo "${name}@${version} was published concurrently."
            fi
          else
            echo "${out}" >&2
            exit 1
          fi
